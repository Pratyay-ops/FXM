# git-cliff configuration for the release notes people read: the release pull request and the
# GitHub Release, which scripts/release-notes.sh prints without --changelog. They list the
# features, bug fixes and performance changes of the release, each once, after the release's
# hand-written summary (docs/releases/v<version>.md, which release-notes.sh prints first).
# Documentation, tests, CI, build, chores and refactoring are left out, and so is the internal
# work of every type: the scopes tooling, release, deploy, ci and plan, and integration and test
# work (the parser before the features says which subjects). CHANGELOG.md keeps the whole
# history (cliff.toml). Keep the body and the preprocessors in step with cliff.toml's.
# Preview the next release's notes with `make release-notes`.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# The same body as cliff.toml's. release-notes.sh drops the version heading, as the pull request
# and the GitHub Release show their own title. Entries with the same message, such as a commit
# and its copy on a stacked branch, are listed once.
body = """

{% if version -%}
  {% if previous.version -%}
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Pratyay-ops/FXM/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {% else -%}
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Pratyay-ops/FXM/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {% endif -%}
{% else -%}
  ## Unreleased
{% endif -%}
{% if commits | length == 0 %}
  No notable changes.
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim }}
  {% for commit in commits | unique(attribute="message") %}
    - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Pratyay-ops/FXM/commit/{{ commit.id }}))
  {%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Drops commits that are not Conventional Commits: merges, "Initial commit" and the like.
filter_unconventional = true
split_commits = false
# As in cliff.toml: an @name that isn't part of a word or an e-mail address goes into a code
# span, so the notes notify nobody on GitHub.
commit_preprocessors = [
  { pattern = '(?m)(^|[^\w`])(@[\w-]+(?:\.[\w-]+)*(?:/[\w-]+(?:\.[\w-]+)*)?)', replace = '${1}`${2}`' },
]
# Groups in the order the template prints them; the HTML comments only sort them.
commit_parsers = [
  { field = "merge_commit", pattern = "^true$", skip = true },
  { message = '^Merge ', skip = true },
  # Commits whose subjects slipped past the rules below, each named by its full hash: a merge's
  # fix that names no merge, and plumbing written as a feature or a fix. The notes are for the
  # people who use FXM; CHANGELOG.md keeps them all.
  { sha = "b494e8fe4e38ee2cafc1adadafb4b983be05146c", skip = true }, # plugins' and Spotify's hosts after a merge
  { sha = "b3c7bd216b07e407be4103d839497b101b81b2eb", skip = true }, # evaluator workers from blobs
  { sha = "1077769c0ae8edfcd1422cff6945929455fe9e3e", skip = true }, # stream lifecycle internals
  { sha = "d03f3fd743132a89eaf1b8a66496b7105e24a44a", skip = true }, # stream lifecycle internals
  { sha = "f873b0fa126214cfd067979062b347c5a4910d86", skip = true }, # host table lookup
  { sha = "fd0eaf13c988bdfc1582eafffa5c562308dbb14c", skip = true }, # request policy type
  { sha = "ef5558360779bb5e911084562971f77abfb9f554", skip = true }, # transports' host table
  { sha = "632ae935d91ee19714df755d4469c352fdfc4cb1", skip = true }, # converter internals
  { sha = "361fc552658fb8486b6a328d3891a9ebc39930d1", skip = true }, # autoplay wiring after a merge
  # Internal work, whatever its type: the toolchain, releases, the deploy, CI and the plan.
  { message = '^[a-z]+\((tooling|release|deploy|ci|plan)\)', skip = true },
  # Integration and test work, whatever its type: what a merge of develop or another stage broke
  # (merged, develop's, another stage's such as 2.9's or a lettered one's such as 2.9b's) and the
  # fakes the tests use (fixtures, type tests, test streams, the tests' helpers).
  { message = '''^[a-z]+(\([a-z]+\))?!?: .*(\bmerged\b|\bdevelop's\b|\bfixtures\b|\btype tests\b|\btest streams\b|\btests' |\b[0-9]\.[0-9]+[a-z]?'s\b)''', skip = true },
  { message = '^feat', group = "<!-- 0 -->Features" },
  { message = '^fix', group = "<!-- 1 -->Bug fixes" },
  { message = '^perf', group = "<!-- 2 -->Performance" },
  # docs, test, ci, build, chore, refactor, style and any other type.
  { message = '.*', skip = true },
]
protect_breaking_commits = false
filter_commits = false
# Release tags only: vX.Y.Z, created by .github/workflows/release.yml.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
