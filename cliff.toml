# git-cliff configuration for CHANGELOG.md, generated from the Conventional Commits
# (docs/WORKFLOW.md section 4): every release, with every change, each message once. The release
# notes in the pull request and the GitHub Release list only what people who use FXM notice
# (cliff.notes.toml). The release scripts run the pinned git-cliff from .tools/bin
# (scripts/install-git-cliff.sh) with --offline, so nothing here reaches the network.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to FXM, newest release first. `make release-pr` generates this file from \
the Conventional Commits with [git-cliff](https://git-cliff.org) when it prepares a release, so \
don't edit it by hand: the configuration is in `cliff.toml`.
"""
# One section per release, each starting with a blank line. Merge commits never reach the
# template: they are not conventional (filter_unconventional), and the first parsers below skip
# any that would be. Entries with the same message, such as a commit and its copy on a stacked
# branch, are listed once. cliff.notes.toml has the same body, so keep the two in step.
body = """

{% if version -%}
  {% if previous.version -%}
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Pratyay-ops/FXM/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {% else -%}
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Pratyay-ops/FXM/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {% endif -%}
{% else -%}
  ## Unreleased
{% endif -%}
{% if commits | length == 0 %}
  No notable changes.
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim }}
  {% for commit in commits | unique(attribute="message") %}
    - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Pratyay-ops/FXM/commit/{{ commit.id }}))
  {%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Drops commits that are not Conventional Commits: merges, "Initial commit" and the like.
filter_unconventional = true
split_commits = false
# The notes go into the release pull request and the GitHub Release, where "@name" notifies
# that GitHub user or team. An npm scope such as @fxm/core or @playwright/test is not meant to,
# so any @name that isn't part of a word or an e-mail address goes into a code span.
commit_preprocessors = [
  { pattern = '(?m)(^|[^\w`])(@[\w-]+(?:\.[\w-]+)*(?:/[\w-]+(?:\.[\w-]+)*)?)', replace = '${1}`${2}`' },
]
# Groups in the order the template prints them; the HTML comments only sort them.
commit_parsers = [
  # Bookkeeping, not changes: merge commits, the plan's status updates and the release commit.
  { field = "merge_commit", pattern = "^true$", skip = true },
  { message = '^Merge ', skip = true },
  { message = '^docs\(plan\)', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = "<!-- 0 -->Features" },
  { message = '^fix', group = "<!-- 1 -->Bug fixes" },
  { message = '^perf', group = "<!-- 2 -->Performance" },
  { message = '^refactor', group = "<!-- 3 -->Refactoring" },
  { message = '^docs', group = "<!-- 4 -->Documentation" },
  { message = '^test', group = "<!-- 5 -->Tests" },
  { message = '^ci', group = "<!-- 6 -->CI" },
  { message = '^build', group = "<!-- 7 -->Build" },
  { message = '^chore', group = "<!-- 8 -->Chores" },
  # Any other type (style:, revert:, a typo) still shows up instead of vanishing.
  { message = '.*', group = "<!-- 9 -->Other" },
]
protect_breaking_commits = false
filter_commits = false
# Release tags only: vX.Y.Z, created by .github/workflows/release.yml.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
