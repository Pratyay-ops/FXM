version: 2
updates:
  # JavaScript dependencies. youtubei.js in particular must track YouTube changes.
  # Dependabot runs pnpm without scripts/env.sh, on its own Node (24.22.1 on 2026-10-26), which
  # "engines" in package.json leaves out. That is why engine-strict lives in env.sh: these updates
  # run, and CI checks each one on the .nvmrc Node (docs/DEVELOPMENT.md, "Node version").
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    ignore:
      # react-router 8 needs Node >= 22.22; the toolchain runs the Node 22 pinned in .nvmrc
      # (22.20 today). Upgrade once .nvmrc moves to 22.22+ (follow-up from stage 2.1).
      - dependency-name: react-router
        update-types: ['version-update:semver-major']
      # @types/node follows the Node major in .nvmrc, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # wrangler for the deploy job only (stage 2.8), in its own pnpm root with its own lockfile.
  - package-ecosystem: npm
    directory: /scripts/build-dist-wrangler
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: build

  # Rust crates of the desktop app (stage 7.1). Merge a minor bump of the tauri crate together
  # with the matching @tauri-apps/api bump from npm: tauri build refuses mismatched versions.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
