name: Release

# Publishes a GitHub Release when main gets a version (package.json) that has none yet, which
# happens when a release pull request from `make release-pr` is merged (docs/WORKFLOW.md,
# "Releases"). Every other push to main ends after the plan job.
#
#   plan            reads the version and decides whether to release (scripts/release-plan.sh)
#   bundles         builds the web zip, which is make dist's dist/pages (the landing page, the web
#                   app, _headers and the third-party notices, as Cloudflare Pages serves them), and
#                   the FXM Connect zips (scripts/release-build.sh), and runs AMO's linter on the
#                   Firefox zip (apps/extension/store/firefox.ts)
#   firefox         with AMO_CHANNEL unlisted (the default): has Firefox Add-ons (AMO) sign that
#                   Firefox zip and passes on the signed XPI (apps/extension/store/firefox.ts)
#   desktop         builds the desktop app's installers for macOS, Windows and Linux, signs the
#                   files its updater installs and writes the updater's latest.json
#                   (desktop-release.yml, which apps/desktop/README.md explains)
#   publish         collects the artifact jobs' files (scripts/release-collect.sh), writes
#                   SHA256SUMS, attests every file's build provenance, creates tag vX.Y.Z and
#                   publishes the release (scripts/release-publish.sh) with the version's notes:
#                   its summary in docs/releases/ and git-cliff's list (scripts/release-notes.sh)
#   firefox-listed  with AMO_CHANNEL listed: once the release is out, submits its Firefox zip to
#                   AMO's public listing (apps/extension/store/firefox.ts)
#   edge            once the release is out, submits its Chromium zip to Edge Add-ons
#                   (apps/extension/store/edge.ts)
#
# The desktop job signs with the updater key, the secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD of the desktop-updater environment, which only runs on main
# can use and whose every run the owner approves (apps/desktop/README.md, "The updater key"). The
# job passes both on by name, as GitHub needs for an environment's secret to reach a called
# workflow's job; they are never repository secrets. Without them, or while tauri.conf.json
# carries the placeholder instead of the updater's public key, it fails, and nothing is published.
#
# The store jobs (firefox, firefox-listed and edge) use secrets that the owner adds to the
# `stores` environment, which only runs on main can use (apps/extension/README.md, "Store
# channels"): AMO_API_KEY and AMO_API_SECRET, and EDGE_PRODUCT_ID, EDGE_CLIENT_ID and
# EDGE_API_KEY. Without them they skip their work with a notice, and the release goes out
# without the signed XPI or the store submissions. The repository variable AMO_CHANNEL picks
# AMO's channel: unlisted (the default), listed or off. A store job installs nothing: it runs
# Node and the release commit's store scripts on the files the bundles job built, so no
# third-party code ever sees a store key. Its plan step learns only whether each secret is set
# (`secrets.X != ''`); only the step that submits gets the values.
#
# Every job builds the commit the run was started for (plan's sha is always github.sha), which
# is also the commit the attestations name. Re-running is safe: a published release stops at
# the plan job, a draft left by a failed run is replaced, and a tag without a release is
# finished only by a re-run of the run that created it. A tag at any other commit stops the
# run, so a tag pushed by hand never gets a commit built and published. Builds start from a
# clean runner, without caches, so nothing from other runs reaches the files.
#
# Adding artifacts (the APK in 6.6; the firefox and desktop jobs are two):
#   1. Add a job that needs plan, runs `if: needs.plan.outputs.release == 'true'`, checks out
#      needs.plan.outputs.sha and uploads its files as an artifact named release-<name>. The
#      files sit at the artifact's root (no folders) and carry the version in their names.
#   2. List those files for release-<name> in fxm_release_catalog (scripts/release-lib.sh):
#      the collect step refuses any file that the catalog doesn't list for its artifact, so a
#      job can never replace another job's files.
#   3. Add the job to publish's needs, and a download step for release-<name> next to the
#      release-bundles one (each artifact into its own folder under dist/artifacts).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release run at a time, and never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-plan.sh

  bundles:
    name: Web app, landing page and FXM Connect
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      firefox-lint: ${{ steps.lint.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up toolchain and dependencies (frozen lockfile)
        run: make ci-setup

      # The same Jamendo switch as the deploy's make dist (deploy.yml), so the web zip is what
      # Cloudflare Pages serves.
      - name: Build the release files
        env:
          VITE_FXM_JAMENDO_CLIENT_ID: ${{ vars.FXM_JAMENDO_CLIENT_ID }}
        run: scripts/release-build.sh dist/release

      # AMO's linter (web-ext lint) on the Firefox zip, here where no store key is around. The
      # Firefox jobs submit the zip only if it found nothing. A finding warns here and fails
      # those jobs instead, so it doesn't hold up a release that skips AMO.
      - name: Lint FXM Connect with AMO's rules
        id: lint
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          scripts/run.sh pnpm --filter @fxm/extension --silent store:firefox lint
          --zip "$GITHUB_WORKSPACE/dist/release/fxm-connect-firefox-$VERSION.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  firefox:
    name: Signed Firefox add-on
    needs: [plan, bundles]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Up to 10 minutes for AMO's validator and 20 for the signature.
    timeout-minutes: 45
    # The AMO keys are secrets of this environment, which only runs on main can use.
    environment: stores
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.submit.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Without the AMO keys, or with AMO_CHANNEL set to listed or off, this says so and the
      # steps below are skipped: the job succeeds and the release has no signed XPI. When it
      # would sign a zip that AMO's linter didn't pass, it fails, and the release with it.
      - name: Check the AMO settings
        id: plan
        env:
          AMO_API_KEY_SET: ${{ secrets.AMO_API_KEY != '' }}
          AMO_API_SECRET_SET: ${{ secrets.AMO_API_SECRET != '' }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL }}
          FIREFOX_LINT: ${{ needs.bundles.outputs.firefox-lint }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/extension/store/firefox.ts plan --channel unlisted

      # The Firefox zip exactly as the release attaches it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.plan.outputs.submit == 'true'
        with:
          name: release-bundles
          path: dist/artifacts/release-bundles

      # Uploads the zip, creates the version with the source code for AMO's reviewers, waits for
      # the signature (or carries on with the version AMO already has, on a re-run) and checks
      # that the signed file holds the zip's files and Mozilla's signature, and nothing else.
      - name: Sign it on Firefox Add-ons
        id: submit
        if: steps.plan.outputs.submit == 'true'
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/extension/store/firefox.ts submit --channel unlisted --version "$VERSION"
          --zip "dist/artifacts/release-bundles/fxm-connect-firefox-$VERSION.zip"
          --out dist/release-firefox

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.submit.outputs.signed == 'true'
        with:
          name: release-firefox
          path: dist/release-firefox/
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Desktop app
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/desktop-release.yml
    permissions:
      contents: read
    with:
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: [plan, bundles, firefox, desktop]
    # No artifact job may fail or be cancelled. A job that can skip itself on purpose doesn't
    # block, as long as its download step below runs only `if: needs.<job>.result == 'success'`.
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the attestations (Sigstore)
      attestations: write # store the attestations
    steps:
      # The full history and tags, for git-cliff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # One download per artifact, by name, each into its own folder: merged into one folder,
      # an artifact could silently overwrite another's file of the same name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: dist/artifacts/release-bundles

      # Only when AMO signed this version: the firefox job may skip its work on purpose.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.firefox.outputs.signed == 'true'
        with:
          name: release-firefox
          path: dist/artifacts/release-firefox

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-desktop
          path: dist/artifacts/release-desktop

      - name: Collect the release files
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/release-collect.sh "$VERSION" dist/artifacts dist/release

      - name: Write SHA256SUMS
        run: scripts/release-build.sh --checksums dist/release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

      - name: Generate the release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: scripts/release-publish.sh "$VERSION" "$SHA" dist/release "$RUNNER_TEMP/notes.md"

  firefox-listed:
    name: Firefox Add-ons listing
    needs: [plan, bundles, publish]
    # After the release is published, so that AMO never gets a version GitHub doesn't have.
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true'
      && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The AMO keys are secrets of this environment, which only runs on main can use.
    environment: stores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Does nothing unless AMO_CHANNEL is listed and the AMO keys are set. Fails when it would
      # submit a zip that AMO's linter didn't pass.
      - name: Check the AMO settings
        id: plan
        env:
          AMO_API_KEY_SET: ${{ secrets.AMO_API_KEY != '' }}
          AMO_API_SECRET_SET: ${{ secrets.AMO_API_SECRET != '' }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL }}
          FIREFOX_LINT: ${{ needs.bundles.outputs.firefox-lint }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/extension/store/firefox.ts plan --channel listed

      # The Firefox zip exactly as the release published it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.plan.outputs.submit == 'true'
        with:
          name: release-bundles
          path: dist/artifacts/release-bundles

      # Uploads the zip and creates the listed version, with the listing texts and the source code
      # for AMO's reviewers. AMO may approve it within minutes or wait for a reviewer; the job
      # doesn't wait, and Firefox users get the version from AMO once it is approved.
      - name: Submit FXM Connect to the listing
        if: steps.plan.outputs.submit == 'true'
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/extension/store/firefox.ts submit --channel listed --version "$VERSION"
          --zip "dist/artifacts/release-bundles/fxm-connect-firefox-$VERSION.zip"

  edge:
    name: Edge Add-ons submission
    needs: [plan, publish]
    # After the release is published, so that a store never gets a version GitHub doesn't have.
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true'
      && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Edge key is a secret of this environment, which only runs on main can use.
    environment: stores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Without the three Edge secrets this says so and the steps below are skipped. The Edge
      # Add-ons API can only update an extension that the owner first published in Partner
      # Center.
      - name: Check the Edge settings
        id: plan
        env:
          EDGE_PRODUCT_ID_SET: ${{ secrets.EDGE_PRODUCT_ID != '' }}
          EDGE_CLIENT_ID_SET: ${{ secrets.EDGE_CLIENT_ID != '' }}
          EDGE_API_KEY_SET: ${{ secrets.EDGE_API_KEY != '' }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/extension/store/edge.ts plan

      # The Chromium zip exactly as the release published it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.plan.outputs.submit == 'true'
        with:
          name: release-bundles
          path: dist/artifacts/release-bundles

      # Uploads the zip as the draft's package and submits it for certification, which takes up
      # to seven business days; the job doesn't wait for the outcome.
      - name: Submit FXM Connect to Edge Add-ons
        if: steps.plan.outputs.submit == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/extension/store/edge.ts submit --version "$VERSION"
          --zip "dist/artifacts/release-bundles/fxm-connect-chromium-$VERSION.zip"
