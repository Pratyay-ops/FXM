name: Android

# Builds the debug APK with the same repo-local toolchain as on your machine (make
# android-setup, make apk) and keeps it as a workflow artifact. It runs when the app or anything
# its build uses changes: the web app and the packages it bundles, the toolchain scripts (not
# make dist's and the deploy job's, stage 2.8) and the Makefile, Node and the dependencies. Keep
# both lists the same.
#
# Run by hand (workflow_dispatch) with `release`, it is also a dry run of the release jobs
# (stage 6.6): it builds the release APKs, signs them with a throwaway key made for the step
# (`release-apk.sh dry-run`; never FXM's key, which only release runs on main can use) and
# uploads them as the artifact fxm-android-dry-run. It tags and publishes nothing:
#
#   gh workflow run android.yml --ref <branch> -f release=true
on:
  push:
    paths:
      - apps/mobile/**
      - apps/web/**
      - packages/**
      - scripts/**
      - '!scripts/build-dist/**'
      - '!scripts/build-dist-wrangler/**'
      - Makefile
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/mobile/**
      - apps/web/**
      - packages/**
      - scripts/**
      - '!scripts/build-dist/**'
      - '!scripts/build-dist-wrangler/**'
      - Makefile
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      release:
        description: Also build the release APKs, signed with a throwaway key (a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm and its store in .tools/, the same cache as ci.yml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/bin
            .tools/pnpm/store
          key: tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/install-*.sh') }}
          restore-keys: tools-${{ runner.os }}-

      # The JDK and Android SDK, pinned by scripts/android-setup.sh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/jdk
            .tools/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('scripts/android-setup.sh') }}

      # The Gradle home: the wrapper's Gradle and the downloaded dependencies.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/gradle/caches
            .tools/gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'apps/mobile/android/**/*.gradle', 'apps/mobile/android/gradle.properties', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up toolchain and dependencies (frozen lockfile)
        run: make ci-setup

      - name: Install the JDK and Android SDK into .tools
        run: make android-setup

      - name: Doctor
        run: make doctor

      - name: Build the debug APK
        run: make apk

      # The JVM tests of FXM's OkHttp plugin and native player (apps/mobile/android/fxm-http and
      # fxm-player), offline.
      - name: Run the native unit tests
        run: make android-test

      # scripts/make-android-keystore.sh and the release signing, with a throwaway key and APKs
      # that aapt2 links from a bare manifest, offline.
      - name: Test the release signing
        run: make apk-sign-test

      # cap sync rewrites capacitor.settings.gradle with a path into pnpm's store that names the
      # Capacitor version, so after an upgrade the committed file is stale until it is regenerated.
      - name: Check that the build left the committed Android project unchanged
        run: |
          if [ -n "$(git status --porcelain -- apps/mobile/android)" ]; then
            git status --short -- apps/mobile/android
            git --no-pager diff -- apps/mobile/android
            echo "::error::make apk changed apps/mobile/android. Run make apk and commit what it regenerated."
            exit 1
          fi

      # The dry run: the release job's build, with its Jamendo switch (release.yml), then its
      # signing with a key made for this run only.
      - name: Build the unsigned release APKs (dry run)
        if: inputs.release
        env:
          VITE_FXM_JAMENDO_CLIENT_ID: ${{ vars.FXM_JAMENDO_CLIENT_ID }}
        run: apps/mobile/scripts/release-apk.sh build dist/android-unsigned

      # A key made for this step in a private temporary folder, and deleted after it.
      - name: Sign them with a throwaway key (dry run)
        if: inputs.release
        run: apps/mobile/scripts/release-apk.sh dry-run dist/android-unsigned dist/android-dry-run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: fxm-android-dry-run
          path: dist/android-dry-run/
          if-no-files-found: error
          retention-days: 7

      # Gradle's lock and garbage-collection state must not go into the cache.
      - name: Prepare the Gradle home for caching
        run: rm -f .tools/gradle/caches/modules-2/modules-2.lock .tools/gradle/caches/modules-2/gc.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
