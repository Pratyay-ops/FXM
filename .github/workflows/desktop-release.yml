name: Desktop release

# Builds the desktop app's release files for one version: installers for macOS (Apple silicon and
# Intel), Windows x64 and Linux x64 and arm64, the files the updater installs, and latest.json,
# which tells installed apps about the version. Two workflows call it:
#
#   release.yml, for every release (release: true), on the commit it releases, with the updater
#   key and the Windows code-signing certificate. It publishes the artifact release-desktop that
#   this uploads.
#   desktop.yml, as a dry run when someone starts it by hand with release-dry-run: the same builds,
#   signed with throwaway keys and certificates, and kept as workflow artifacts. No release, no
#   tag. With windows-unsigned as well, the Windows files stay unsigned, as in a release without
#   a certificate.
#
#   check   the version (apps/desktop/package.json, which must equal the version input) and, for a
#           release, the updater's public key in tauri.conf.json: while it is the placeholder,
#           every release stops here
#   notices the third-party notices that every installer carries (apps/desktop/release/notices.ts):
#           the licences of the Rust crates of all five targets (cargo metadata), then make dist's
#           notices for the web app. It stops on a crate whose licence FXM doesn't accept, or that
#           ships no licence text and has no review
#   build   tauri-action, one job for each macOS and Linux target (apps/desktop/release/targets.ts
#           lists these and Windows; test/release-workflow.test.ts checks it), with
#           src-tauri/tauri.release.conf.json, which turns on the updater's files. tauri build
#           signs those with a throwaway key of each job's own, never with the updater key: these
#           jobs run the code of hundreds of crates and packages. macOS builds are signed ad hoc
#           (bundle > macOS > signingIdentity "-") and not notarized. The macOS Intel build is
#           cross-compiled on Apple silicon. On Linux, the tools the bundler makes the AppImage
#           with, and the AppImage runtime, come from pinned releases, checked against their
#           SHA-256 (apps/desktop/release/appimage-tools.ts). Each build bundles the notices job's
#           file (tauri.release.conf.json), and checks that its installers carry it, as
#           windows-build does; windows-bundle bundles the same file
#   windows-build, windows-sign-app, windows-bundle, windows-sign-installers, windows-check
#           Windows x64, in five jobs, so that the code-signing certificate's key never meets the
#           build's code (stage 7.6, docs/CODE-SIGNING.md, release/windows-signing.ts). The first
#           compiles fxm.exe and makes both installers, unsigned, with Tauri's signing hooked to
#           collect the files it would sign; the second signs those; the third makes the
#           installers again around the signed files; the fourth signs the installers; the last
#           reads every signature and hands the installers on. Only the two signing jobs name the
#           windows-signing environment, whose secrets WINDOWS_CERTIFICATE and
#           WINDOWS_CERTIFICATE_PASSWORD hold a release's certificate, and they install and build
#           nothing: GitHub's own actions, PowerShell, the Windows SDK's signtool and this
#           repository's scripts. A release without a certificate ships the first job's unsigned
#           installers (apps/desktop/INSTALL.md says what that means for users), as does a dry
#           run with windows-unsigned; any other dry run signs with throwaway certificates made
#           on the runners
#   sign    once check, build and windows-check succeeded, whichever Windows jobs were skipped:
#           signs the files the updater installs with the updater key, writes latest.json and
#           checks every signature against the public key the apps carry
#           (apps/desktop/release/release.ts). It installs nothing, so no third-party code ever
#           sees the key: the secrets TAURI_SIGNING_PRIVATE_KEY and
#           TAURI_SIGNING_PRIVATE_KEY_PASSWORD of the desktop-updater environment, which only
#           runs on main can use and whose every run the owner approves. release.yml passes
#           them on by name, as GitHub needs for an environment's secret to reach this job
#           (apps/desktop/README.md, "The updater key")
#
# Builds start from a clean runner, without caches, as in release.yml.

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to build
        required: true
        type: string
      version:
        description: The version to build (x.y.z), or empty for the app's own
        required: false
        type: string
        default: ''
      release:
        description: Sign with the updater key, for a release; otherwise this is a dry run
        required: false
        type: boolean
        default: false
      # release.ts refuses it for a release, which signs whenever it has a certificate.
      windows-unsigned:
        description: Sign no Windows file in a dry run, to try a release without a certificate
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # Windows code signing (stage 7.6): the windows-signing environment's. release.yml passes
      # them on by name, as GitHub needs for an environment's secret to reach a called workflow's
      # job; only windows-sign-app and windows-sign-installers name that environment and read them.
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the version and the updater key
        id: check
        env:
          MODE: ${{ inputs.release && 'release' || 'dry-run' }}
          VERSION: ${{ inputs.version }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts check --mode "$MODE" --version "$VERSION"

  notices:
    name: Third-party notices
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Rust for cargo metadata, which lists each target's crates and fetches their source code,
      # licence files included.
      - name: Set up pnpm, dependencies and Rust (frozen lockfile)
        run: |
          make ci-setup
          make rust-setup

      # make dist's third-party notices: the packages of the web app the desktop app shows, with
      # the Jamendo switch of the deploy's make dist (deploy.yml) and of the builds below. Without
      # stage 4.2's ffmpeg core, which the desktop app's web build doesn't include (only make dist
      # puts it into the deployed app): make dist looks for none (an empty folder) and, with
      # CI=false, composes without it, as it does outside CI, so the notices name only what the
      # installers carry.
      - name: Compose dist/pages, for its third-party notices
        env:
          CI: false
          FXM_FFMPEG_CORE_DIR: ${{ runner.temp }}/no-ffmpeg-core
          VITE_FXM_JAMENDO_CLIENT_ID: ${{ vars.FXM_JAMENDO_CLIENT_ID }}
        run: make dist

      - name: Write the desktop app's third-party notices
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts notices --version "$VERSION"
          --web dist/pages/third-party-notices.txt --out apps/desktop/dist/third-party-notices.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: apps/desktop/dist/third-party-notices.txt
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.name }}
    needs: [check, notices]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # A release needs every target, and a dry run shows every failure.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            target: macos-arm64
            os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            target: macos-x64
            os: macos-latest
            triple: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux (x64)
            target: linux-x64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Linux (arm64)
            target: linux-arm64
            os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The packages listed under "Desktop app" in docs/DEVELOPMENT.md, then the GStreamer
      # plugins the AppImage bundles (bundleMediaFramework in tauri.conf.json): GStreamer's base
      # and good plugins and the audio outputs, all LGPL. gstreamer-check.sh refuses others.
      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y --no-install-recommends gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa
          sudo apt-get remove -y gstreamer1.0-libav gstreamer1.0-plugins-ugly \
            gstreamer1.0-plugins-bad
          apps/desktop/release/gstreamer-check.sh

      # The repo's own toolchain scripts, as desktop.yml uses.
      - name: Set up pnpm, dependencies and Rust (frozen lockfile)
        run: |
          make ci-setup
          make rust-setup
          cd apps/desktop/src-tauri && ../../../scripts/run.sh rustup target add "$TRIPLE"

      # Where tauri.release.conf.json takes the notices from, among the app's resources.
      - name: Get the third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: apps/desktop/dist

      # tauri build makes the updater's files only with a key, and signs them with it. That is a
      # throwaway key: the sign job signs the files again with the updater key. A dry run also
      # builds the apps with the throwaway public key, as the placeholder can't build them.
      - name: Make a throwaway key for tauri build
        id: build-key
        shell: bash
        env:
          DRY_RUN: ${{ !inputs.release }}
        run: |
          args=(build-key --out "$RUNNER_TEMP/build-key")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            apps/desktop/release/release.ts "${args[@]}"

      # The bundler would download the tools it makes the AppImage with, and appimagetool the
      # AppImage runtime, the file's first bytes, and run them unchecked, some from releases that
      # are rebuilt every month. This puts each one where they look first (the bundler's tools
      # folder, target/.tauri with useLocalToolsDir), from a release that isn't rebuilt, checked
      # against its SHA-256 (apps/desktop/release/appimage-tools.ts).
      - name: Fetch the AppImage tools, checked (Linux)
        id: appimage-tools
        if: runner.os == 'Linux'
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts appimage-tools --triple "$TRIPLE"
          --out apps/desktop/src-tauri/target/.tauri

      # Without tagName or releaseId, tauri-action only builds: it uploads nothing and creates no
      # release. It runs the Tauri CLI through scripts/run.sh, so pnpm and Rust come from .tools/:
      # without a pnpm it can find, it would install the latest CLI globally. LDAI_RUNTIME_FILE
      # hands appimagetool the checked runtime (Linux only). The web app it embeds gets the Jamendo
      # switch of make dist (deploy.yml), so it offers Jamendo exactly when the deployed web app
      # does.
      - name: Build the installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.build-key.outputs.key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          LDAI_RUNTIME_FILE: ${{ steps.appimage-tools.outputs.runtime-file }}
          VITE_FXM_JAMENDO_CLIENT_ID: ${{ vars.FXM_JAMENDO_CLIENT_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: ${{ format('{0}/scripts/run.sh pnpm tauri', github.workspace) }}
          args: >-
            --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json ${{ steps.build-key.outputs.config-args }}
            -- --locked

      # The bundler downloads a tool only when its file is missing: anything in the folder that the
      # step above didn't put there, after an update of the Tauri CLI say, it fetched unchecked.
      # And every AppImage must start with the checked runtime, whatever appimagetool did.
      - name: Check the AppImage's tools and runtime (Linux)
        if: runner.os == 'Linux'
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts appimage-tools --triple "$TRIPLE"
          --out apps/desktop/src-tauri/target/.tauri --after-build
          --bundle-dir "apps/desktop/src-tauri/target/$TRIPLE/release/bundle"

      # Each installer must carry the notices job's file where the app reads it: in FXM.app's
      # Resources folder, and in /usr/lib/FXM of the .deb, whose folder the AppImage is made from.
      # windows-build checks the Windows installers' copy.
      - name: Check that the installers carry the third-party notices
        shell: bash
        run: |
          notices=apps/desktop/dist/third-party-notices.txt
          release="apps/desktop/src-tauri/target/$TRIPLE/release"
          case "$RUNNER_OS" in
            macOS) cmp "$notices" "$release/bundle/macos/FXM.app/Contents/Resources/third-party-notices.txt" ;;
            Linux)
              for deb in "$release"/bundle/deb/*.deb; do
                dpkg-deb --fsys-tarfile "$deb" |
                  tar -xO --wildcards '*usr/lib/FXM/third-party-notices.txt' | cmp - "$notices"
              done
              ;;
          esac

      - name: Collect the release files
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts collect --target "$TARGET" --version "$VERSION"
          --bundle-dir "apps/desktop/src-tauri/target/$TRIPLE/release/bundle" --out dist/desktop

      # The ad-hoc signature is what lets macOS offer "Open Anyway" for an app from the internet:
      # Apple silicon refuses unsigned code as damaged.
      - name: Check the ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/$TRIPLE/release/bundle/macos/FXM.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -qx 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"

      - name: Check the .deb's dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          deb="dist/desktop/fxm-desktop-$VERSION-$TARGET.deb"
          dpkg-deb --field "$deb" Package Depends | tee "$RUNNER_TEMP/deb.txt"
          for package in gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav; do
            grep -q "$package" "$RUNNER_TEMP/deb.txt"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 7
          # The installers are compressed already.
          compression-level: 0

  # Windows (stage 7.6): the code-signing certificate's key never meets the build's code. This
  # job and windows-bundle run that code (Vite and its plugins, cargo and the build scripts of
  # hundreds of crates, the Tauri CLI, NSIS and WiX) and have no access to the key: neither names
  # the windows-signing environment nor reads its secrets. Tauri's own signing runs this
  # repository's hook instead of signtool, which copies each file Tauri would sign before packing
  # it (fxm.exe, patched for each installer, and the NSIS plugins) and signs nothing
  # (apps/desktop/release/windows-signing.ts). The installers it makes are unsigned, which a
  # release without a certificate ships.
  windows-build:
    name: Windows (x64)
    needs: [check, notices]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: windows-x64
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The toolchain and components of apps/desktop/src-tauri/rust-toolchain.toml (a test in
      # apps/desktop/test keeps them equal).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Install dependencies (frozen lockfile)
        shell: bash
        env:
          pnpm_config_store_dir: ${{ github.workspace }}/.tools/pnpm/store
          # What scripts/env.sh sets on macOS and Linux: refuse a Node outside "engines".
          pnpm_config_engine_strict: true
        run: pnpm install --frozen-lockfile

      # Where tauri.release.conf.json takes the notices from, among the app's resources.
      - name: Get the third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: apps/desktop/dist

      # As in the build job: the updater key never reaches a job that builds.
      - name: Make a throwaway key for tauri build
        id: build-key
        shell: bash
        env:
          DRY_RUN: ${{ !inputs.release }}
        run: |
          args=(build-key --out "$RUNNER_TEMP/build-key")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            apps/desktop/release/release.ts "${args[@]}"

      - name: Hook Tauri's signing to collect the files to sign
        id: hook
        shell: bash
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-hook-config --mode collect
          --dir "$RUNNER_TEMP/to-sign" --out "$RUNNER_TEMP/hook"

      # Without tagName or releaseId, tauri-action only builds: it uploads nothing and creates no
      # release. The web app it embeds gets the Jamendo switch of make dist (deploy.yml), as in
      # the build job.
      - name: Build the installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.build-key.outputs.key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VITE_FXM_JAMENDO_CLIENT_ID: ${{ vars.FXM_JAMENDO_CLIENT_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: >-
            --target x86_64-pc-windows-msvc --bundles nsis,msi
            --config src-tauri/tauri.release.conf.json ${{ steps.build-key.outputs.config-args }}
            ${{ steps.hook.outputs.config-args }} -- --locked

      # This job doesn't unpack the NSIS installer and the MSI: it checks the copy that tauri build
      # puts next to fxm.exe, from the same resources the two bundlers install. windows-bundle
      # packs the same file, and fails without it.
      - name: Check that the installers carry the third-party notices
        shell: bash
        run: |
          release="apps/desktop/src-tauri/target/$TRIPLE/release"
          cmp apps/desktop/dist/third-party-notices.txt "$release/third-party-notices.txt"

      - name: Check the files to sign
        shell: bash
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-collected --dir "$RUNNER_TEMP/to-sign"

      - name: Collect the release files (unsigned)
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts collect --target "$TARGET" --version "$VERSION"
          --bundle-dir "apps/desktop/src-tauri/target/$TRIPLE/release/bundle"
          --out dist/windows-unsigned

      # fxm.exe as built, for windows-bundle, which makes the installers around it again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/fxm.exe
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-to-sign
          path: ${{ runner.temp }}/to-sign/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: dist/windows-unsigned/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Signs fxm.exe, both copies, and the NSIS plugins, after checking that they are what Tauri
  # would sign: the copies of fxm.exe differ in their bundle type alone, the plugins are the ones
  # Tauri downloads. With a release's certificate, from the windows-signing environment, which
  # only runs on main can use. It installs and builds nothing: GitHub's own actions, PowerShell
  # (windows-certificate.ps1), the Windows SDK's signtool and this repository's scripts.
  windows-sign-app:
    name: Windows (x64), sign the app
    needs: [check, windows-build]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: ${{ inputs.release && 'windows-signing' || '' }}
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.choose.outputs.signing }}
      thumbprint: ${{ steps.certificate.outputs.thumbprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # This step learns only whether the environment holds a certificate; only the next one
      # gets its value.
      - name: Choose how to sign
        id: choose
        shell: bash
        env:
          MODE: ${{ inputs.release && 'release' || 'dry-run' }}
          HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' && 'yes' || '' }}
          UNSIGNED: ${{ inputs.windows-unsigned && 'yes' || '' }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-signing --mode "$MODE"
          --certificate "$HAS_CERTIFICATE" --unsigned "$UNSIGNED"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.choose.outputs.signing != 'none'
        with:
          name: windows-to-sign
          path: ${{ runner.temp }}/to-sign

      - name: Put the certificate in the runner's store
        id: certificate
        if: steps.choose.outputs.signing != 'none'
        shell: pwsh
        env:
          SIGNING: ${{ steps.choose.outputs.signing }}
          WINDOWS_CERTIFICATE: ${{ steps.choose.outputs.signing == 'certificate' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ steps.choose.outputs.signing == 'certificate' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: '& ./apps/desktop/release/windows-certificate.ps1 -Signing $env:SIGNING'

      - name: Sign the app and the NSIS plugins
        if: steps.choose.outputs.signing != 'none'
        shell: bash
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-sign --phase app --dir "$RUNNER_TEMP/to-sign"
          --out "$RUNNER_TEMP/signed-app" --thumbprint "$THUMBPRINT"
          --timestamp-url "$TIMESTAMP_URL"

      - name: Take the certificate out of the store
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:THUMBPRINT" -DeleteKey

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.choose.outputs.signing != 'none'
        with:
          name: windows-signed-app
          path: ${{ runner.temp }}/signed-app/
          if-no-files-found: error
          retention-days: 1

  # Makes the installers again around the same fxm.exe, with Tauri's signing hooked to put the
  # signed copy of each file in its place as Tauri packs it. Like windows-build, it runs the
  # build's code and has no access to the key.
  windows-bundle:
    name: Windows (x64), installers
    needs: [check, notices, windows-sign-app]
    if: needs.windows-sign-app.outputs.signing != 'none'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: windows-x64
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The Tauri CLI asks cargo about the project, under rust-toolchain.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Install dependencies (frozen lockfile)
        shell: bash
        env:
          pnpm_config_store_dir: ${{ github.workspace }}/.tools/pnpm/store
          # What scripts/env.sh sets on macOS and Linux: refuse a Node outside "engines".
          pnpm_config_engine_strict: true
        run: pnpm install --frozen-lockfile

      # The same notices as windows-build's installers: tauri bundle packs them from here.
      - name: Get the third-party notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: apps/desktop/dist

      - name: Make a throwaway key for tauri bundle
        id: build-key
        shell: bash
        env:
          DRY_RUN: ${{ !inputs.release }}
        run: |
          args=(build-key --out "$RUNNER_TEMP/build-key")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            apps/desktop/release/release.ts "${args[@]}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-signed-app
          path: ${{ runner.temp }}/signed-app

      - name: Hook Tauri's signing to put the signed files in place
        id: hook
        shell: bash
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-hook-config --mode swap
          --dir "$RUNNER_TEMP/signed-app" --out "$RUNNER_TEMP/hook"

      # bundle, not build: it packs the fxm.exe that windows-build compiled.
      - name: Make the installers around the signed app
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.build-key.outputs.key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          BUILD_KEY_ARGS: ${{ steps.build-key.outputs.config-args }}
          HOOK_ARGS: ${{ steps.hook.outputs.config-args }}
        run: >-
          pnpm tauri bundle --target "$TRIPLE" --bundles nsis,msi
          --config src-tauri/tauri.release.conf.json $BUILD_KEY_ARGS $HOOK_ARGS

      - name: Check that the signed files went in
        shell: bash
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-swapped --dir "$RUNNER_TEMP/signed-app"

      - name: Collect the release files
        shell: bash
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts collect --target "$TARGET" --version "$VERSION"
          --bundle-dir "apps/desktop/src-tauri/target/$TRIPLE/release/bundle"
          --out dist/windows-installers

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: dist/windows-installers/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Signs the two installers, as windows-sign-app signed the app: the same environment, and
  # nothing of the build's code.
  windows-sign-installers:
    name: Windows (x64), sign the installers
    needs: [check, windows-sign-app, windows-bundle]
    if: needs.windows-sign-app.outputs.signing != 'none'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: ${{ inputs.release && 'windows-signing' || '' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    outputs:
      thumbprint: ${{ steps.certificate.outputs.thumbprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installers
          path: ${{ runner.temp }}/installers

      # How windows-sign-app signed: a release's certificate, or a throwaway one of this job's own.
      - name: Put the certificate in the runner's store
        id: certificate
        shell: pwsh
        env:
          SIGNING: ${{ needs.windows-sign-app.outputs.signing }}
          WINDOWS_CERTIFICATE: ${{ needs.windows-sign-app.outputs.signing == 'certificate' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ needs.windows-sign-app.outputs.signing == 'certificate' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: '& ./apps/desktop/release/windows-certificate.ps1 -Signing $env:SIGNING'

      - name: Sign the installers
        shell: bash
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-sign --phase installers
          --dir "$RUNNER_TEMP/installers" --version "$VERSION" --thumbprint "$THUMBPRINT"
          --timestamp-url "$TIMESTAMP_URL"

      - name: Take the certificate out of the store
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:THUMBPRINT" -DeleteKey

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed-installers
          path: ${{ runner.temp }}/installers/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Reads the signature of both installers, of the fxm.exe inside each and of the NSIS plugins:
  # signed by the certificates of the two signing jobs and timestamped, or, for a release without
  # a certificate, not signed at all. It unpacks the installers here, with no key around: the
  # MSI through an administrative install (it only unpacks), the NSIS installer with 7-Zip. Then
  # it hands the installers on to the sign job, as the build job does for the other targets.
  windows-check:
    name: Windows (x64), check the signatures
    needs: [check, windows-build, windows-sign-app, windows-sign-installers]
    if: >-
      ${{ !cancelled() && needs.windows-build.result == 'success'
      && needs.windows-sign-app.result == 'success'
      && (needs.windows-sign-installers.result == 'success'
      || (needs.windows-sign-app.outputs.signing == 'none'
      && needs.windows-sign-installers.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows-sign-app.outputs.signing == 'none' && 'windows-unsigned' || 'windows-signed-installers' }}
          path: dist/desktop

      - name: Check the Windows signatures
        shell: pwsh
        env:
          SIGNING: ${{ needs.windows-sign-app.outputs.signing }}
          APP_THUMBPRINT: ${{ needs.windows-sign-app.outputs.thumbprint }}
          THUMBPRINT: ${{ needs.windows-sign-installers.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-Item -Path dist/desktop/*.msi
          $setup = Get-Item -Path dist/desktop/*-setup.exe
          $fromMsi = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'msi-contents')
          $unpack = Start-Process msiexec.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$($fromMsi.FullName)`"")
          if ($unpack.ExitCode -ne 0) { throw "msiexec /a exited with $($unpack.ExitCode)" }
          $fromNsis = Join-Path $env:RUNNER_TEMP 'nsis-contents'
          7z x $setup.FullName "-o$fromNsis" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE" }
          $inside = { param($folder) Get-ChildItem -LiteralPath $folder -Recurse -Filter fxm.exe |
            Select-Object -First 1 -ExpandProperty FullName }
          $files = @(
            @{ name = $msi.Name; role = 'installer'; path = $msi.FullName },
            @{ name = $setup.Name; role = 'installer'; path = $setup.FullName },
            @{ name = "fxm.exe in $($msi.Name)"; role = 'app'; path = & $inside $fromMsi.FullName },
            @{ name = "fxm.exe in $($setup.Name)"; role = 'app'; path = & $inside $fromNsis }
          )
          # Every library in the NSIS installer is one of its plugins.
          foreach ($plugin in Get-ChildItem -LiteralPath $fromNsis -Recurse -Filter *.dll) {
            $files += @{
              name = "$($plugin.Name) in $($setup.Name)"; role = 'plugin'; path = $plugin.FullName
            }
          }
          $report = foreach ($file in $files) {
            if (-not $file.path) { throw "$($file.name) not found" }
            $signature = Get-AuthenticodeSignature -LiteralPath $file.path
            [pscustomobject]@{
              file = $file.name
              role = $file.role
              status = "$($signature.Status)"
              signer = $signature.SignerCertificate.Thumbprint
              timestamped = $null -ne $signature.TimeStamperCertificate
            }
          }
          $path = Join-Path $env:RUNNER_TEMP 'windows-signatures.json'
          ConvertTo-Json -InputObject @($report) | Set-Content -LiteralPath $path
          node --experimental-strip-types --disable-warning=ExperimentalWarning `
            apps/desktop/release/release.ts windows-signatures --signing $env:SIGNING `
            --thumbprint "$env:THUMBPRINT" --app-thumbprint "$env:APP_THUMBPRINT" --report $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-x64
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign:
    name: Updater signatures
    needs: [check, build, windows-check]
    # A condition of its own: GitHub skips every job after a skipped one unless the job's
    # condition says otherwise (actions/runner#491), and a release without a Windows certificate
    # skips windows-bundle and windows-sign-installers. This job must still run after
    # windows-check then, as release.yml publishes the artifact it uploads.
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && needs.build.result == 'success'
      && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For a release, the updater key's environment: only runs on main can use it, and each waits
    # here for the owner's approval before the key reaches this job. A dry run uses none.
    environment: ${{ inputs.release && 'desktop-updater' || '' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Each build's artifact into a folder of its own: merged, one could overwrite another's file.
      # Only the build jobs' artifacts are called desktop-*: release.ts sign refuses anything else.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist/artifacts

      - name: Sign the updater's files and write latest.json
        if: inputs.release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts sign --version "$VERSION" --artifacts dist/artifacts
          --out dist/release-desktop --repo "$REPO"

      - name: Sign with a throwaway key and write latest.json (dry run)
        if: ${{ !inputs.release }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts sign --version "$VERSION" --artifacts dist/artifacts
          --out dist/release-desktop --repo "$REPO" --throwaway-key

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop
          path: dist/release-desktop/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
