name: Desktop release

# Builds the desktop app's release files for one version: installers for macOS (Apple silicon and
# Intel), Windows x64 and Linux x64 and arm64, the files the updater installs, and latest.json,
# which tells installed apps about the version. Two workflows call it:
#
#   release.yml, for every release (release: true), on the commit it releases, with the updater
#   key. It publishes the artifact release-desktop that this uploads.
#   desktop.yml, as a dry run when someone starts it by hand with release-dry-run: the same builds,
#   signed with a throwaway key and kept as workflow artifacts. No release, no tag.
#
#   check   the version (apps/desktop/package.json, which must equal the version input) and, for a
#           release, the updater's public key in tauri.conf.json: while it is the placeholder,
#           every release stops here
#   build   tauri-action, one job per target (apps/desktop/release/targets.ts lists the same five,
#           test/release-workflow.test.ts checks it), with src-tauri/tauri.release.conf.json, which
#           turns on the updater's files. tauri build signs those with a throwaway key of each
#           job's own, never with the updater key: these jobs run the code of hundreds of crates
#           and packages. macOS builds are signed ad hoc (bundle > macOS > signingIdentity "-") and
#           not notarized. The macOS Intel build is cross-compiled on Apple silicon. Windows
#           builds are code-signed (stage 7.6, docs/CODE-SIGNING.md): a release with the
#           certificate in the windows-signing environment's secrets WINDOWS_CERTIFICATE and
#           WINDOWS_CERTIFICATE_PASSWORD, and unsigned without them (apps/desktop/INSTALL.md says
#           what that means for users); a dry run with a throwaway certificate made on the runner.
#           Tauri signs fxm.exe, the NSIS installer and its uninstaller, and the MSI, and the job
#           checks every signature (apps/desktop/release/windows-signing.ts)
#   sign    signs the files the updater installs with the updater key, writes latest.json and
#           checks every signature against the public key the apps carry
#           (apps/desktop/release/release.ts). It installs nothing, so no third-party code ever
#           sees the key: the secrets TAURI_SIGNING_PRIVATE_KEY and
#           TAURI_SIGNING_PRIVATE_KEY_PASSWORD, which release.yml passes on, or the
#           desktop-updater environment's (apps/desktop/README.md, "Updates")
#
# Builds start from a clean runner, without caches, as in release.yml.

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to build
        required: true
        type: string
      version:
        description: The version to build (x.y.z), or empty for the app's own
        required: false
        type: string
        default: ''
      release:
        description: Sign with the updater key, for a release; otherwise this is a dry run
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # Windows code signing (stage 7.6). Only the windows-signing environment should hold them:
      # release.yml passes none, so they reach only the Windows build of a release run.
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the version and the updater key
        id: check
        env:
          MODE: ${{ inputs.release && 'release' || 'dry-run' }}
          VERSION: ${{ inputs.version }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts check --mode "$MODE" --version "$VERSION"

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # For a release's Windows build, the code-signing certificate's environment: give it only the
    # main branch (and, if wanted, the owner as reviewer), and no other run can read it.
    environment: ${{ inputs.release && matrix.target == 'windows-x64' && 'windows-signing' || '' }}
    permissions:
      contents: read
    strategy:
      # A release needs every target, and a dry run shows every failure.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            target: macos-arm64
            os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            target: macos-x64
            os: macos-latest
            triple: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows (x64)
            target: windows-x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux (x64)
            target: linux-x64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Linux (arm64)
            target: linux-arm64
            os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The packages listed under "Desktop app" in docs/DEVELOPMENT.md, then the GStreamer
      # plugins the AppImage bundles (bundleMediaFramework in tauri.conf.json): GStreamer's base
      # and good plugins and the audio outputs, all LGPL. gstreamer-check.sh refuses others.
      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y --no-install-recommends gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa
          sudo apt-get remove -y gstreamer1.0-libav gstreamer1.0-plugins-ugly \
            gstreamer1.0-plugins-bad
          apps/desktop/release/gstreamer-check.sh

      # macOS and Linux use the repo's own toolchain scripts, as desktop.yml does.
      - name: Set up pnpm, dependencies and Rust (frozen lockfile)
        if: runner.os != 'Windows'
        run: |
          make ci-setup
          make rust-setup
          cd apps/desktop/src-tauri && ../../../scripts/run.sh rustup target add "$TRIPLE"

      - name: Set up pnpm (Windows)
        if: runner.os == 'Windows'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The toolchain and components of apps/desktop/src-tauri/rust-toolchain.toml (a test in
      # apps/desktop/test keeps them equal).
      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Install dependencies (Windows, frozen lockfile)
        if: runner.os == 'Windows'
        shell: bash
        env:
          pnpm_config_store_dir: ${{ github.workspace }}/.tools/pnpm/store
        run: pnpm install --frozen-lockfile

      # tauri build makes the updater's files only with a key, and signs them with it. That is a
      # throwaway key: the sign job signs the files again with the updater key. A dry run also
      # builds the apps with the throwaway public key, as the placeholder can't build them.
      - name: Make a throwaway key for tauri build
        id: build-key
        shell: bash
        env:
          DRY_RUN: ${{ !inputs.release }}
        run: |
          args=(build-key --out "$RUNNER_TEMP/build-key")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            apps/desktop/release/release.ts "${args[@]}"

      # Windows code signing (stage 7.6, docs/CODE-SIGNING.md). This step learns only whether the
      # windows-signing environment holds a certificate; only the next step gets its value.
      - name: Choose how to sign the Windows files
        id: windows-signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          MODE: ${{ inputs.release && 'release' || 'dry-run' }}
          HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' && 'yes' || '' }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-signing --mode "$MODE"
          --certificate "$HAS_CERTIFICATE"

      # Into the store of the runner's account, where Tauri's signtool finds it by thumbprint: a
      # throwaway certificate for a dry run, or the release certificate, imported with a key that
      # can't be exported again. The PKCS #12 file is deleted at once.
      - name: Put the signing certificate in the runner's store (Windows)
        id: windows-certificate
        if: runner.os == 'Windows' && steps.windows-signing.outputs.signing != 'none'
        shell: pwsh
        env:
          SIGNING: ${{ steps.windows-signing.outputs.signing }}
          WINDOWS_CERTIFICATE: ${{ steps.windows-signing.outputs.signing == 'certificate' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ steps.windows-signing.outputs.signing == 'certificate' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING -eq 'throwaway') {
            $certificate = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject 'CN=FXM release dry run (throwaway, untrusted)' `
              -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 `
              -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(2)
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            try {
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfx -Password $password `
                -CertStoreLocation Cert:\CurrentUser\My |
                Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            } finally {
              Remove-Item -LiteralPath $pfx -Force
            }
            if (-not $certificate) { throw 'WINDOWS_CERTIFICATE holds no certificate with its private key' }
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Sign with that certificate (Windows)
        id: windows-config
        if: runner.os == 'Windows' && steps.windows-signing.outputs.signing != 'none'
        shell: bash
        env:
          THUMBPRINT: ${{ steps.windows-certificate.outputs.thumbprint }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts windows-signing-config --thumbprint "$THUMBPRINT"
          --timestamp-url "$TIMESTAMP_URL" --out "$RUNNER_TEMP/windows-signing"

      # Without tagName or releaseId, tauri-action only builds: it uploads nothing and creates no
      # release. On macOS and Linux it runs the Tauri CLI through scripts/run.sh, so pnpm and Rust
      # come from .tools/: without a pnpm it can find, it would install the latest CLI globally.
      - name: Build the installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.build-key.outputs.key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          tauriScript: ${{ runner.os == 'Windows' && 'pnpm tauri' || format('{0}/scripts/run.sh pnpm tauri', github.workspace) }}
          args: >-
            --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json ${{ steps.build-key.outputs.config-args }}
            ${{ steps.windows-config.outputs.config-args }} -- --locked

      - name: Collect the release files
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts collect --target "$TARGET" --version "$VERSION"
          --bundle-dir "apps/desktop/src-tauri/target/$TRIPLE/release/bundle" --out dist/desktop

      # fxm.exe (which the installers hold) and the two installers: signed by the certificate of
      # this run and timestamped, or, for a release without one, not signed at all.
      - name: Check the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNING: ${{ steps.windows-signing.outputs.signing }}
          THUMBPRINT: ${{ steps.windows-certificate.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-Item -LiteralPath "apps/desktop/src-tauri/target/$env:TRIPLE/release/fxm.exe") +
            @(Get-ChildItem -LiteralPath dist/desktop -File)
          $report = foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            [pscustomobject]@{
              file = $file.Name
              status = "$($signature.Status)"
              signer = $signature.SignerCertificate.Thumbprint
              timestamped = $null -ne $signature.TimeStamperCertificate
            }
          }
          $path = Join-Path $env:RUNNER_TEMP 'windows-signatures.json'
          ConvertTo-Json -InputObject @($report) | Set-Content -LiteralPath $path
          node --experimental-strip-types --disable-warning=ExperimentalWarning `
            apps/desktop/release/release.ts windows-signatures --signing $env:SIGNING `
            --thumbprint "$env:THUMBPRINT" --report $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The ad-hoc signature is what lets macOS offer "Open Anyway" for an app from the internet:
      # Apple silicon refuses unsigned code as damaged.
      - name: Check the ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/$TRIPLE/release/bundle/macos/FXM.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -qx 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"

      - name: Check the .deb's dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          deb="dist/desktop/fxm-desktop-$VERSION-$TARGET.deb"
          dpkg-deb --field "$deb" Package Depends | tee "$RUNNER_TEMP/deb.txt"
          for package in gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav; do
            grep -q "$package" "$RUNNER_TEMP/deb.txt"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 7
          # The installers are compressed already.
          compression-level: 0

  sign:
    name: Updater signatures
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For a release, the updater key's environment: give it only the main branch, and no other
    # run can read the key. A dry run uses none.
    environment: ${{ inputs.release && 'desktop-updater' || '' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Each build's artifact into a folder of its own: merged, one could overwrite another's file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist/artifacts

      - name: Sign the updater's files and write latest.json
        if: inputs.release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts sign --version "$VERSION" --artifacts dist/artifacts
          --out dist/release-desktop --repo "$REPO"

      - name: Sign with a throwaway key and write latest.json (dry run)
        if: ${{ !inputs.release }}
        run: >-
          node --experimental-strip-types --disable-warning=ExperimentalWarning
          apps/desktop/release/release.ts sign --version "$VERSION" --artifacts dist/artifacts
          --out dist/release-desktop --repo "$REPO" --throwaway-key

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop
          path: dist/release-desktop/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
