name: E2E

# The web app as it ships, in a browser (apps/web/e2e/README.md): make dist served the way
# Cloudflare Pages serves it, with its real _headers, in Playwright's Chromium, headless, muted
# and offline but for the runner itself. Apart from ci.yml, so make check stays fast.
#
#   flows    the critical flows end to end: the tiers, search and play, the queue, the library,
#            lyrics, Home, a download, an import, settings, the update toast and the embed.
#            One retry at most (playwright.config.ts).
#   budgets  the performance budgets: chunk sizes, a first visit's transfer, and its LCP, CLS and
#            INP on a mid-range phone over Slow 4G. Runs even when a flow fails, so both report,
#            and adds its tables to the job summary.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e flows and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm and its store in .tools/, the same cache as ci.yml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/bin
            .tools/pnpm/store
          key: tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/install-*.sh') }}
          restore-keys: tools-${{ runner.os }}-

      - name: Set up toolchain and dependencies (frozen lockfile)
        run: make ci-setup

      # As v0.1.0 deploys: without Jamendo's client_id, whose copy the flows read.
      - name: Compose dist/pages
        timeout-minutes: 10
        run: make dist

      # Playwright's Chromium, into .tools/playwright (scripts/env.sh). Without --with-deps: the
      # runner has the libraries Chromium needs already (it has Chrome), and apt would only add
      # fonts and upgrades, from a mirror that once took over 5 minutes for 26 MB.
      - name: Install Chromium
        id: chromium
        timeout-minutes: 5
        run: scripts/run.sh pnpm --filter @fxm/web exec playwright install --no-shell chromium

      - name: Critical flows
        timeout-minutes: 15
        run: scripts/run.sh pnpm --filter @fxm/web exec playwright test -c e2e/flows/playwright.config.ts

      - name: Performance budgets
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        timeout-minutes: 12
        run: scripts/run.sh pnpm --filter @fxm/web exec playwright test -c e2e/budgets/playwright.config.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
