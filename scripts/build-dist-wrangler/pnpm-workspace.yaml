# Makes this folder its own pnpm root, so the main workspace never installs wrangler.
minimumReleaseAge: 20160
# The code this root installs runs with the Cloudflare token, so pnpm also refuses a release with
# weaker proof of origin (trusted publishing, then provenance) than the package's earlier
# releases had, the usual sign of a stolen npm token. Like minimumReleaseAge, it checks every
# lockfile entry on every install, frozen ones too (docs/DEVELOPMENT.md, "New dependencies").
trustPolicy: no-downgrade
# Advisories that make audit ignores (docs/DEVELOPMENT.md, "Security fixes"). Remove each entry
# with its fix.
auditConfig:
  ignoreGhsas:
    # undici 7.29.1, which miniflare pins: a server's response can crash the process. wrangler
    # loads miniflare's copy but sends deploy.sh's requests through the one it bundles into its
    # own code, which no audit sees (docs/DEVELOPMENT.md, "Security alerts"). 7.30.1 turns 14
    # days old on 2026-10-29; then an override ('undici@>=7.18.0 <7.30.1': 7.30.1) replaces
    # miniflare's copy, and this entry goes.
    - GHSA-xjj6-f33q-929c
allowBuilds:
  esbuild: false
  workerd: false
