[package]
# Also the executable's name: fxm, fxm.exe, FXM.app/Contents/MacOS/fxm.
name = "fxm"
version = "0.0.0"
description = "FXM desktop app: the web app in a Tauri 2 shell"
authors = ["FXM contributors"]
license = "Apache-2.0"
repository = "https://github.com/Pratyay-ops/FXM"
edition = "2024"
publish = false

# The shell lives in the library so tests can reach it. Desktop only needs the default
# rlib: mobile targets would add staticlib and cdylib, but Android uses Capacitor.
[lib]
name = "fxm_desktop_lib"

# Pick versions that have been public for at least 14 days, as everywhere else in the repo.
[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
# tray-icon: the tray menu that controls playback while the window is hidden (stage 7.3).
tauri = { version = "2.12.3", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unsafe-headers lets requests set Origin, which youtubei.js needs (stage 7.2). The rest are
# the plugin's default features minus `cookies`, a jar that would save every response cookie
# in plain text in the app's cache folder and send it back. youtubei.js needs no jar, and
# stage 7.4 decides how Spotify credentials are stored.
tauri-plugin-http = { version = "2.8.2", default-features = false, features = [
  "unsafe-headers",
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
] }
# Asks the user before FXM may contact a host they typed in Settings (src/user_hosts.rs). The web
# app gets no dialog permission: only Rust opens dialogs.
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"

# The macOS version, which decides between Opus and AAC (src/environment.rs). Already in the
# dependency tree through tauri, with this feature.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSProcessInfo",
] }

# Whether the library behind the Linux tray icon is installed (src/tray.rs). Already in the
# dependency tree through tray-icon's libappindicator.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7.4"

[features]
# The live smoke test's build (apps/desktop/smoke): prints the hidden page's report and exits.
# Never on in release builds.
smoke = []

# A thin shell around the web build: optimize release builds for size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
