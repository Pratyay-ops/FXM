[package]
# Also the executable's name: fxm, fxm.exe, FXM.app/Contents/MacOS/fxm.
name = "fxm"
version = "0.0.0"
description = "FXM desktop app: the web app in a Tauri 2 shell"
authors = ["FXM contributors"]
license = "Apache-2.0"
repository = "https://github.com/Pratyay-ops/FXM"
edition = "2024"
publish = false

# The shell lives in the library so tests can reach it. Desktop only needs the default
# rlib: mobile targets would add staticlib and cdylib, but Android uses Capacitor.
[lib]
name = "fxm_desktop_lib"

# Pick versions that have been public for at least 14 days, as everywhere else in the repo.
[build-dependencies]
# Must match the `tauri` crate's: tauri-build checks that both carry `isolation`.
tauri-build = { version = "2.7.2", features = ["isolation"] }

[dependencies]
# `isolation` passes every IPC message through the hook in ../isolation (stage 7.2). Without the
# feature, Tauri ignores the pattern in tauri.conf.json. tray-icon: the tray menu that controls
# playback while the window is hidden (stage 7.3).
tauri = { version = "2.12.3", features = ["isolation", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unsafe-headers lets requests set Origin, which youtubei.js needs (stage 7.2). gzip and brotli
# let InnerTube's and Spotify's JSON arrive compressed, as in a browser; requests with a Range
# header still ask for `identity`, so media bytes stay exact. The rest are the plugin's default
# features minus `cookies`, a jar that would save every response cookie in plain text in the
# app's cache folder and send it back. youtubei.js needs no jar, and stage 7.4 decides how
# Spotify credentials are stored.
tauri-plugin-http = { version = "2.8.2", default-features = false, features = [
  "unsafe-headers",
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
  "gzip",
  "brotli",
] }
# The proxy settings the plugin follows (`system-proxy`), which src/user_hosts.rs checks.
hyper-util = { version = "0.1.21", features = ["client-proxy", "client-proxy-system"] }
# Asks the user before FXM may contact a host they typed in Settings (src/user_hosts.rs). Used
# directly rather than through tauri-plugin-dialog, whose script would replace window.alert and
# window.confirm in every page with IPC calls the app doesn't allow. The features are the ones
# tauri-plugin-dialog used: GTK 3 on Linux, modern task dialogs on Windows.
rfd = { version = "0.16.0", default-features = false, features = [
  "gtk3",
  "common-controls-v6",
] }
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"

# The macOS version, which decides between Opus and AAC (src/environment.rs), and the
# notification that the window has left full screen, which the close button waits for before it
# hides the window (src/fullscreen.rs). All already in the dependency tree through tauri.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSNotification",
  "NSOperation",
  "NSProcessInfo",
  "NSString",
] }

# Whether the library behind the Linux tray icon is installed, and whether a panel shows such
# icons (src/tray.rs). Already in the dependency tree through tray-icon's libappindicator and GTK.
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.22.10"
libloading = "0.7.4"

[features]
# The live smoke test's build (apps/desktop/smoke): prints the hidden page's report and exits.
# Never on in release builds.
smoke = []

# A thin shell around the web build: optimize release builds for size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
