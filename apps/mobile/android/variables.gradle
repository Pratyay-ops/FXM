ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // FXM's native HTTP (fxm-http); its tests use MockWebServer of the same release. OkHttp 5.5
    // needs compileSdk 37, which Android Gradle plugin 8.13 does not support.
    okhttpVersion = '5.4.0'
    orgJsonVersion = '20250517'
    // FXM's native player (fxm-player). 1.11 needs compileSdk 36; its OkHttp data source is built
    // against OkHttp 4.12 and runs on fxm-http's 5.4.0, which keeps every method it calls.
    media3Version = '1.11.1'
}